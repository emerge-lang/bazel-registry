name: Add rules_emerge version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "rules_emerge version to add, e.g. 0.10.0 (a leading 'v' is accepted)"
        required: true
        type: string

permissions:
  contents: write

env:
  COMPILER_REPO: emerge-lang/compiler
  MODULE_DIR: modules/rules_emerge

jobs:
  add-version:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize version input
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW_VERSION' is not a valid version (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify release exists and is not a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! release=$(gh release view "$TAG" --repo "$COMPILER_REPO" --json isPrerelease,isDraft); then
            echo "::error::Release $TAG does not exist in $COMPILER_REPO"
            exit 1
          fi
          if [ "$(jq -r '.isDraft' <<<"$release")" = "true" ]; then
            echo "::error::Release $TAG in $COMPILER_REPO is a draft"
            exit 1
          fi
          if [ "$(jq -r '.isPrerelease' <<<"$release")" = "true" ]; then
            echo "::error::Release $TAG in $COMPILER_REPO is a pre-release"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Create branch and add module version
        id: add
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          target="$MODULE_DIR/$VERSION"
          if [ -e "$target" ]; then
            echo "::error::$target already exists in the registry"
            exit 1
          fi

          branch="rules_emerge-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::Branch $branch already exists on origin"
            exit 1
          fi
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          # template source.json: the most recent version listed in metadata.json
          previous=$(jq -r '.versions[-1]' "$MODULE_DIR/metadata.json")
          echo "Using $previous as template for source.json"

          mkdir "$target"

          gh api "repos/$COMPILER_REPO/contents/bazel/rules_emerge/MODULE.bazel?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > "$target/MODULE.bazel"

          # sanity check: the module version in MODULE.bazel must match the release
          if ! grep -Eq "version[[:space:]]*=[[:space:]]*\"$VERSION\"" "$target/MODULE.bazel"; then
            echo "::error::MODULE.bazel at $TAG does not declare version \"$VERSION\""
            cat "$target/MODULE.bazel"
            exit 1
          fi

          jq --arg tag "$TAG" '.tag = $tag' "$MODULE_DIR/$previous/source.json" > "$target/source.json"

          jq --indent 4 --arg v "$VERSION" '.versions += [$v]' "$MODULE_DIR/metadata.json" > metadata.json.tmp
          mv metadata.json.tmp "$MODULE_DIR/metadata.json"

          git status
          git diff

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.add.outputs.branch }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"

          git add "$MODULE_DIR"
          git commit -m "Add rules_emerge $VERSION"
          git push -u origin "$BRANCH"

          compare_url="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1"
          echo "Open a PR for $BRANCH: $compare_url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Branch $BRANCH pushed. Open a PR: $compare_url"
